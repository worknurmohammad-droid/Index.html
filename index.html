<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nur Mohammad | Portfolio</title>
    <!-- Font Awesome Icons for Social Media -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .image-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .verified-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            border: 3px solid var(--card-bg);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .tagline {
            color: var(--accent-color);
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bio {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .highlight {
            color: #f43f5e; /* Passion color for music */
            font-weight: 600;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .social-link i {
            font-size: 20px;
            width: 30px;
            text-align: left;
        }

        .social-link .arrow {
            font-size: 12px;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        /* Hover states for specific buttons */
        .link-fb:hover {
            background-color: #1877f2;
            border-color: #1877f2;
        }
        .link-insta:hover {
            background-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            background-color: #e1306c;
            border-color: #e1306c;
        }
        .link-call:hover {
            background-color: #10b981;
            border-color: #10b981;
        }

        .social-link:hover .arrow {
            transform: translateX(4px);
            color: #fff;
        }

        .footer {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Profile Image -->
        <div class="image-container">
            <img src="profile.jpg" alt="Nur Mohammad" class="profile-img">
            <div class="verified-badge">
                <i class="fas fa-check"></i>
            </div>
        </div>

        <!-- Name & Info -->
        <h1>Nur Mohammad</h1>
        <div class="tagline">Computer Operator</div>
        
        <p class="bio">
            আমি পেশায় একজন কম্পিউটার অপারেটর এবং গর্বিত মালিক <strong>NurComputer's</strong>-এর। প্রযুক্তি নিয়ে কাজ করার পাশাপাশি অবসরে আমি <span class="highlight"><i class="fas fa-music"></i> গান গাইতে</span> ভীষণ ভালোবাসি।
        </p>

        <!-- Social & Contact Links -->
        <div class="links-container">
            <!-- Facebook -->
            <a href="https://www.facebook.com/share/18UKvpwuKv/" target="_blank" class="social-link link-fb">
                <span><i class="fab fa-facebook"></i> Facebook</span>
                <i class="fas fa-chevron-right class arrow"></i>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/nm_mijan?igsh=cHd5YWJvbWdjeGQ0" target="_blank" class="social-link link-insta">
                <span><i class="fab fa-instagram"></i> Instagram</span>
                <i class="fas fa-chevron-right class arrow"></i>
            </a>

            <!-- Phone Call -->
            <a href="tel:01615894462" class="social-link link-call">
                <span><i class="fas fa-phone-alt"></i> Call Me (01615894462)</span>
                <i class="fas fa-chevron-right class arrow"></i>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            &copy; 2026 NurComputer's. All Rights Reserved.
        </div>
    </div>

</body>
</html>
